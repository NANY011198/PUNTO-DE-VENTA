<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Charlie's Pizza ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/charlie.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div class="card login-card text-center">
    <div class="mb-3">
        <div class="fs-1">🍕</div>
        <h3 class="mt-2 mb-0">CHARLIE'S PIZZA</h3>
        <p class="text-white-50 small">SISTEMA ERP & POS</p>
    </div>

    {% if error %}
        <div class="alert alert-danger py-2" role="alert">
            {{ error }}
        </div>
    {% endif %}

    <form action="/login" method="POST">
        <div class="mb-3 text-start">
            <label class="form-label text-white-50">Usuario</label>
            <input type="text" name="usuario" class="form-control" placeholder="Ingresa tu usuario" required autofocus>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label text-white-50">Contraseña</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-charlie w-100 py-2 fs-5">INICIAR SESIÓN</button>
    </form>
</div>

</body>
</html>
