<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Punto de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2>Módulo de Inventario</h2>
        
        <!-- Formulario para agregar productos -->
        <div class="card my-3 p-3 shadow-sm">
            <h4>Agregar Nuevo Producto</h4>
            <form action="/agregar_producto" method="POST" class="row g-3">
                <div class="col-md-4">
                    <input type="text" name="nombre" class="form-control" placeholder="Nombre del producto" required>
                </div>
                <div class="col-md-3">
                    <input type="number" step="0.01" name="precio" class="form-control" placeholder="Precio ($)" required>
                </div>
                <div class="col-md-3">
                    <input type="number" name="stock" class="form-control" placeholder="Cantidad / Stock" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Guardar</button>
                </div>
            </form>
        </div>

        <!-- Tabla de productos registrados -->
        <div class="card p-3 shadow-sm">
            <h4>Lista de Productos</h4>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in productos %}
                    <tr>
                        <td>{{ p.id }}</td>
                        <td>{{ p.nombre }}</td>
                        <td>${{ p.precio }}</td>
                        <td>{{ p.stock }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
