<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charlie's Pizza - POS & ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --accent-yellow: #ffc107;
            --text-light: #f8f9fa;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background-color: #000000;
            border-bottom: 2px solid var(--accent-yellow);
        }
        .card-custom {
            background-color: var(--card-dark);
            border: 1px solid #333;
            border-radius: 8px;
        }
        .module-card {
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            border: 1px solid #333;
            text-decoration: none;
            color: var(--accent-yellow);
            display: block;
        }
        .module-card:hover, .module-card.active {
            border-color: var(--accent-yellow);
            background-color: #222;
            color: var(--accent-yellow);
        }
        .btn-prod {
            background-color: #1a1a1a;
            border: 1px solid var(--accent-yellow);
            color: var(--accent-yellow);
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }
        .btn-prod:hover {
            background-color: var(--accent-yellow);
            color: #000;
        }
        .btn-cobrar {
            background-color: var(--accent-yellow);
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 12px;
            border: none;
            border-radius: 6px;
        }
        .btn-cobrar:hover {
            background-color: #e0a800;
        }
        .table-dark-custom {
            color: #ccc;
        }
        .table-dark-custom th {
            color: #888;
            font-weight: 600;
            border-bottom: 1px solid #333;
        }
        .table-dark-custom td {
            border-bottom: 1px solid #222;
            vertical-align: middle;
        }

        /* Formato de Ticket Impresión */
        #ticket-print-area {
            display: none;
        }
        @media print {
            body * { visibility: hidden; }
            #ticket-print-area, #ticket-print-area * { visibility: visible; }
            #ticket-print-area {
                display: block !important;
                position: absolute;
                left: 0; top: 0; width: 80mm;
                color: #000; background-color: #fff;
                font-family: monospace; font-size: 12px; padding: 10px;
            }
            .ticket-header { text-align: center; border-bottom: 1px dashed #000; padding-bottom: 5px; margin-bottom: 5px; }
            .ticket-line { display: flex; justify-content: space-between; }
            .ticket-total { border-top: 1px dashed #000; font-weight: bold; font-size: 14px; margin-top: 5px; padding-top: 5px; }
        }
    </style>
</head>
<body>

    <!-- Area de impresión de ticket -->
    <div id="ticket-print-area">
        <div class="ticket-header">
            <h4>CHARLIE'S PIZZA</h4>
            <p>Ticket de Venta<br><span id="ticket-date"></span></p>
        </div>
        <div id="ticket-items"></div>
        <div class="ticket-line ticket-total">
            <span>TOTAL:</span>
            <span id="ticket-total-val">$0.00</span>
        </div>
        <div style="text-align: center; margin-top: 15px;">
            <p>¡Gracias por su compra!</p>
        </div>
    </div>

    <!-- Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4 py-2">
        <a class="navbar-brand text-warning fw-bold" href="/">
            <i class="fa-solid fa-pizza-slice me-2"></i>Charlie's Pizza
        </a>
        <div class="ms-auto d-flex align-items-center">
            <span class="me-3 text-light" style="font-size: 0.9rem;"><i class="fa-solid fa-user me-1"></i> Admin</span>
            <button class="btn btn-outline-warning btn-sm" onclick="alert('Cerrando sesión...')">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container-fluid mt-3 px-4">
        <!-- Selector de Módulos (Navegación real por URL a tus plantillas) -->
        <div class="row mb-3 g-2">
            <div class="col">
                <a href="/" class="card card-custom module-card text-center p-2 active">
                    <i class="fa-solid fa-cash-register mb-1"></i>
                    <div style="font-size: 0.85rem;">Ventas / POS</div>
                </a>
            </div>
            <div class="col">
                <a href="/caja" class="card card-custom module-card text-center p-2">
                    <i class="fa-solid fa-wallet mb-1"></i>
                    <div style="font-size: 0.85rem;">Caja Chica</div>
                </a>
            </div>
            <div class="col">
                <a href="/inventario" class="card card-custom module-card text-center p-2">
                    <i class="fa-solid fa-boxes-stacked mb-1"></i>
                    <div style="font-size: 0.85rem;">Inventario / Stock</div>
                </a>
            </div>
            <div class="col">
                <a href="/menu" class="card card-custom module-card text-center p-2">
                    <i class="fa-solid fa-utensils mb-1"></i>
                    <div style="font-size: 0.85rem;">Menú & Recetas</div>
                </a>
            </div>
            <div class="col">
                <a href="/compras" class="card card-custom module-card text-center p-2">
                    <i class="fa-solid fa-cart-shopping mb-1"></i>
                    <div style="font-size: 0.85rem;">Compras</div>
                </a>
            </div>
            <div class="col">
                <a href="/reportes" class="card card-custom module-card text-center p-2">
                    <i class="fa-solid fa-chart-pie mb-1"></i>
                    <div style="font-size: 0.85rem;">Reportes</div>
                </a>
            </div>
        </div>

        <!-- Módulo Ventas / POS -->
        <div class="row">
            <!-- Menú de Productos (Cargados dinámicamente o por categoría) -->
            <div class="col-md-7">
                <div class="card card-custom p-3 mb-3">
                    <div class="row g-2">
                        <div class="col-4">
                            <button class="btn-prod" onclick="addToOrder('Pepperoni', 8.99)">
                                <div>Pepperoni</div>
                                <div style="font-size: 0.85rem;">$8.99</div>
                            </button>
                        </div>
                        <div class="col-4">
                            <button class="btn-prod" onclick="addToOrder('Suprema', 10.99)">
                                <div>Suprema</div>
                                <div style="font-size: 0.85rem;">$10.99</div>
                            </button>
                        </div>
                        <div class="col-4">
                            <button class="btn-prod" onclick="addToOrder('Pizza Personal', 15.00)">
                                <div>Pizza</div>
                                <div style="font-size: 0.85rem;">$15.00</div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla Orden Actual -->
            <div class="col-md-5">
                <div class="card card-custom p-3">
                    <h5 class="text-warning text-center mb-3 fw-bold">Orden Actual</h5>
                    
                    <table class="table table-dark-custom">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th class="text-center">Cant.</th>
                                <th class="text-end">Subtotal</th>
                                <th class="text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="cart-table-body">
                            <tr>
                                <td colspan="4" class="text-center text-muted py-3">No hay productos en la orden</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-secondary">
                        <span class="fs-5 text-secondary">TOTAL:</span>
                        <span class="fs-3 fw-bold text-warning" id="cart-total">$0.00</span>
                    </div>

                    <div class="mt-3 mb-3">
                        <label class="form-label text-secondary" style="font-size: 0.85rem;">Método de Pago:</label>
                        <select class="form-select bg-dark text-light border-secondary">
                            <option value="efectivo">💵 Efectivo</option>
                            <option value="tarjeta">💳 Tarjeta</option>
                        </select>
                    </div>

                    <button class="btn btn-cobrar w-100 mt-2" onclick="cobrarEImprimir()">
                        COBRAR E IMPRIMIR
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cart = [];

        function addToOrder(name, price) {
            let item = cart.find(i => i.name === name);
            if (item) {
                item.qty++;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            renderCart();
        }

        function changeQty(name, delta) {
            let item = cart.find(i => i.name === name);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.name !== name);
                }
            }
            renderCart();
        }

        function removeItem(name) {
            cart = cart.filter(i => i.name !== name);
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cart-table-body');
            const totalEl = document.getElementById('cart-total');
            
            if (cart.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">No hay productos en la orden</td></tr>';
                totalEl.innerText = '$0.00';
                return;
            }

            tbody.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                let subtotal = item.price * item.qty;
                total += subtotal;
                tbody.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-secondary py-0 px-1" onclick="changeQty('${item.name}', -1)">-</button>
                            <span class="mx-1">${item.qty}</span>
                            <button class="btn btn-sm btn-outline-secondary py-0 px-1" onclick="changeQty('${item.name}', 1)">+</button>
                        </td>
                        <td class="text-end">$${subtotal.toFixed(2)}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-danger py-0 px-1" onclick="removeItem('${item.name}')">×</button>
                        </td>
                    </tr>
                `;
            });

            totalEl.innerText = `$${total.toFixed(2)}`;
        }

        function cobrarEImprimir() {
            if (cart.length === 0) {
                alert('Agrega productos a la orden antes de cobrar.');
                return;
            }

            // Preparar e imprimir ticket
            const ticketItems = document.getElementById('ticket-items');
            const ticketDate = document.getElementById('ticket-date');
            const ticketTotalVal = document.getElementById('ticket-total-val');

            ticketDate.innerText = new Date().toLocaleString();
            ticketItems.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                let subtotal = item.price * item.qty;
                total += subtotal;
                ticketItems.innerHTML += `<div class="ticket-line">
                    <span>${item.qty}x ${item.name}</span>
                    <span>$${subtotal.toFixed(2)}</span>
                </div>`;
            });

            ticketTotalVal.innerText = `$${total.toFixed(2)}`;

            alert('¡Venta registrada con éxito!');

            setTimeout(() => {
                window.print();
                cart = [];
                renderCart();
            }, 100);
        }
    </script>
</body>
</html>
