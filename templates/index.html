<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Pizzería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn-categoria { height: 80px; font-size: 1.2rem; font-weight: bold; }
        .btn-platillo { height: 100px; font-size: 1.1rem; font-weight: 600; }
        .grid-menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-3">
        <div class="row">
            <!-- SECCIÓN DEL MENÚ (IZQUIERDA) -->
            <div class="col-md-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2>🍕 Menú del Restaurante</h2>
                    <a href="/inventario" class="btn btn-outline-secondary">Ver Stock Insumos</a>
                </div>

                <!-- Botones de Categorías Principales -->
                <div class="row g-2 mb-4">
                    {% for cat in categorias %}
                    <div class="col-3">
                        <button class="btn btn-primary w-100 btn-categoria" onclick="cargarPlatillos({{ cat.id }}, '{{ cat.nombre }}')">
                            {{ cat.nombre }}
                        </button>
                    </div>
                    {% endfor %}
                </div>

                <!-- Botones de Platillos / Productos de la Categoría Seleccionada -->
                <div class="card p-3 shadow-sm">
                    <h4 id="titulo-categoria" class="text-secondary mb-3">Selecciona una categoría</h4>
                    <div id="grid-platillos" class="grid-menu">
                        <!-- Aquí se cargarán dinámicamente los botones -->
                    </div>
                </div>
            </div>

            <!-- SECCIÓN DEL TICKET / CARRITO (DERECHA) -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">📋 Orden Actual</h4>
                    </div>
                    <div class="card-body d-flex flex-column justify-content-between">
                        <ul id="lista-carrito" class="list-group list-group-flush overflow-auto mb-3" style="max-height: 400px;">
                            <li class="list-group-item text-muted text-center">No hay productos agregados</li>
                        </ul>
                        <div>
                            <hr>
                            <div class="d-flex justify-content-between fs-4 fw-bold mb-3">
                                <span>Total:</span>
                                <span>$<span id="total-venta">0.00</span></span>
                            </div>
                            <button class="btn btn-success btn-lg w-100 py-3 fw-bold" onclick="procesarVenta()">CONFIRMAR VENTA</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let carrito = [];

        function cargarPlatillos(categoriaId, nombreCategoria) {
            document.getElementById('titulo-categoria').innerText = nombreCategoria;
            fetch(`/api/platillos/${categoriaId}`)
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('grid-platillos');
                    grid.innerHTML = '';
                    data.forEach(p => {
                        grid.innerHTML += `
                            <button class="btn btn-outline-dark btn-platillo d-flex flex-column align-items-center justify-content-center" onclick="agregarAlCarrito(${p.id}, '${p.nombre}', ${p.precio})">
                                <span>${p.nombre}</span>
                                <small class="text-muted">$${p.precio.toFixed(2)}</small>
                            </button>
                        `;
                    });
                });
        }

        function agregarAlCarrito(id, nombre, precio) {
            let item = carrito.find(x => x.id === id);
            if (item) {
                item.cantidad++;
            } else {
                carrito.push({ id, nombre, precio, cantidad: 1 });
            }
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const lista = document.getElementById('lista-carrito');
            const totalElem = document.getElementById('total-venta');
            lista.innerHTML = '';
            let total = 0;

            if (carrito.length === 0) {
                lista.innerHTML = '<li class="list-group-item text-muted text-center">No hay productos agregados</li>';
                totalElem.innerText = '0.00';
                return;
            }

            carrito.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;
                lista.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${item.nombre}</strong><br>
                            <small class="text-muted">$${item.precio.toFixed(2)} x ${item.cantidad}</small>
                        </div>
                        <span class="fw-bold">$${subtotal.toFixed(2)}</span>
                    </li>
                `;
            });

            totalElem.innerText = total.toFixed(2);
        }

        function procesarVenta() {
            if (carrito.length === 0) {
                alert("Agrega productos a la orden antes de confirmar.");
                return;
            }

            fetch('/api/vender', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: carrito })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    carrito = [];
                    actualizarCarritoUI();
                } else {
                    alert("Error: " + data.message);
                }
            });
        }
    </script>
</body>
</html>
