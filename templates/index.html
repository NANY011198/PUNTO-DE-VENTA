<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - Charlie's Pizza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --accent-yellow: #d4a017;
            --text-light: #f8f9fa;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background-color: #000000;
            border-bottom: 2px solid var(--accent-yellow);
        }
        .card-custom {
            background-color: var(--card-dark);
            border: 1px solid #2a2a2a;
            border-radius: 8px;
        }
        .module-card {
            transition: transform 0.2s;
            cursor: pointer;
            border: 1px solid #333;
            text-decoration: none;
            color: var(--accent-yellow);
            display: block;
        }
        .module-card:hover, .module-card.active {
            border-color: var(--accent-yellow);
            background-color: #252525;
            color: var(--accent-yellow);
        }
        .btn-prod {
            background-color: #1a1a1a;
            border: 1px solid var(--accent-yellow);
            color: var(--accent-yellow);
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }
        .btn-prod:hover {
            background-color: var(--accent-yellow);
            color: #000;
        }
        .btn-cobrar {
            background-color: var(--accent-yellow);
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 12px;
            border: none;
            border-radius: 6px;
        }
        .btn-cobrar:hover {
            background-color: #e0a800;
        }
        .table-dark-custom {
            color: #ccc;
        }
        .table-dark-custom th {
            color: #888;
            font-weight: 600;
            border-bottom: 1px solid #333;
        }
        .table-dark-custom td {
            border-bottom: 1px solid #222;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <!-- Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4 py-2">
        <a class="navbar-brand text-warning fw-bold" href="/">
            <i class="fa-solid fa-pizza-slice me-2"></i>Charlie's Pizza
        </a>
        <div class="ms-auto d-flex align-items-center">
            <span class="me-3 text-light" style="font-size: 0.9rem;"><i class="fa-solid fa-user me-1"></i> Admin</span>
            <button class="btn btn-outline-warning btn-sm" onclick="alert('Cerrando sesión...')">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container-fluid mt-3 px-4">
        <!-- Navegación Módulos ERP -->
        <div class="row mb-3 g-2">
            <div class="col">
                <a href="/" class="card card-custom module-card text-center p-2 active">
                    <i class="fa-solid fa-cash-register mb-1"></i>
                    <div style="font-size: 0.85rem;">Ventas / POS</div>
                </a>
            </div>
            <div class="col">
                <a href="/caja" class="card card-custom module-card text-center p-2">
                    <i class="fa-solid fa-wallet mb-1"></i>
                    <div style="font-size: 0.85rem;">Caja Chica</div>
                </a>
            </div>
            <div class="col">
                <a href="/inventario" class="card card-custom module-card text-center p-2">
                    <i class="fa-solid fa-boxes-stacked mb-1"></i>
                    <div style="font-size: 0.85rem;">Inventario / Stock</div>
                </a>
            </div>
            <div class="col">
                <a href="/menu" class="card card-custom module-card text-center p-2">
                    <i class="fa-solid fa-utensils mb-1"></i>
                    <div style="font-size: 0.85rem;">Menú & Recetas</div>
                </a>
            </div>
            <div class="col">
                <a href="/compras" class="card card-custom module-card text-center p-2">
                    <i class="fa-solid fa-cart-shopping mb-1"></i>
                    <div style="font-size: 0.85rem;">Compras</div>
                </a>
            </div>
            <div class="col">
                <a href="/reportes" class="card card-custom module-card text-center p-2">
                    <i class="fa-solid fa-chart-pie mb-1"></i>
                    <div style="font-size: 0.85rem;">Reportes</div>
                </a>
            </div>
        </div>

        <!-- Vista POS Ventas -->
        <div class="row">
            <div class="col-md-7">
                <div class="card card-custom p-3 mb-3">
                    <div class="row g-2" id="grid-productos">
                        <div class="col-4">
                            <button class="btn-prod" onclick="addToOrder(1, 'Pepperoni', 8.99)">
                                <div>Pepperoni</div>
                                <div style="font-size: 0.85rem;">$8.99</div>
                            </button>
                        </div>
                        <div class="col-4">
                            <button class="btn-prod" onclick="addToOrder(2, 'Suprema', 10.99)">
                                <div>Suprema</div>
                                <div style="font-size: 0.85rem;">$10.99</div>
                            </button>
                        </div>
                        <div class="col-4">
                            <button class="btn-prod" onclick="addToOrder(3, 'Pizza Personal', 15.00)">
                                <div>Pizza</div>
                                <div style="font-size: 0.85rem;">$15.00</div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Orden Actual -->
            <div class="col-md-5">
                <div class="card card-custom p-3">
                    <h5 class="text-warning text-center mb-3 fw-bold">Orden Actual</h5>
                    
                    <table class="table table-dark-custom">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th class="text-center">Cant.</th>
                                <th class="text-end">Subtotal</th>
                                <th class="text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="cart-table-body">
                            <tr>
                                <td colspan="4" class="text-center text-muted py-3">No hay productos en la orden</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-secondary">
                        <span class="fs-5 text-secondary">TOTAL:</span>
                        <span class="fs-3 fw-bold text-warning" id="cart-total">$0.00</span>
                    </div>

                    <div class="mt-3 mb-3">
                        <label class="form-label text-secondary" style="font-size: 0.85rem;">Método de Pago:</label>
                        <select class="form-select bg-dark text-light border-secondary">
                            <option value="efectivo">💵 Efectivo</option>
                            <option value="tarjeta">💳 Tarjeta</option>
                        </select>
                    </div>

                    <button class="btn btn-cobrar w-100 mt-2" onclick="cobrarEImprimir()">
                        COBRAR E IMPRIMIR
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cart = [];

        function addToOrder(id, name, price) {
            let item = cart.find(i => i.id === id);
            if (item) {
                item.cantidad++;
            } else {
                cart.push({ id, nombre: name, precio: price, cantidad: 1 });
            }
            renderCart();
        }

        function changeQty(id, delta) {
            let item = cart.find(i => i.id === id);
            if (item) {
                item.cantidad += delta;
                if (item.cantidad <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            renderCart();
        }

        function removeItem(id) {
            cart = cart.filter(i => i.id !== id);
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cart-table-body');
            const totalEl = document.getElementById('cart-total');
            
            if (cart.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">No hay productos en la orden</td></tr>';
                totalEl.innerText = '$0.00';
                return;
            }

            tbody.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;
                tbody.innerHTML += `
                    <tr>
                        <td>${item.nombre}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-secondary py-0 px-1" onclick="changeQty(${item.id}, -1)">-</button>
                            <span class="mx-1">${item.cantidad}</span>
                            <button class="btn btn-sm btn-outline-secondary py-0 px-1" onclick="changeQty(${item.id}, 1)">+</button>
                        </td>
                        <td class="text-end">$${subtotal.toFixed(2)}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-danger py-0 px-1" onclick="removeItem(${item.id})">×</button>
                        </td>
                    </tr>
                `;
            });

            totalEl.innerText = `$${total.toFixed(2)}`;
        }

        function cobrarEImprimir() {
            if (cart.length === 0) {
                alert('Agrega productos a la orden antes de cobrar.');
                return;
            }

            fetch('/api/vender', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: cart })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('¡Venta registrada con éxito!');
                    cart = [];
                    renderCart();
                } else {
                    alert('Error al registrar venta: ' + data.message);
                }
            })
            .catch(err => {
                alert('¡Venta registrada con éxito!');
                cart = [];
                renderCart();
            });
        }
    </script>
</body>
</html>
