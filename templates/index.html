<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - Charlie's Pizza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/charlie.css">
    <style>
        .btn-categoria { height: 75px; font-size: 1.1rem; font-weight: bold; }
        .btn-platillo { height: 90px; font-size: 1rem; font-weight: 600; }
        .grid-menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .cart-container { position: sticky; top: 15px; }
    </style>
</head>
<body>

<!-- NAVBAR GLOBAL -->
<nav class="navbar navbar-expand-lg border-bottom border-secondary mb-3 px-3">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/hub">
            <span class="fs-3">🍕</span>
            <span>CHARLIE'S PIZZA</span>
        </a>
        <div class="d-flex gap-2">
            <a href="/hub" class="btn btn-outline-charlie btn-sm">🏠 Menú Principal</a>
            <a href="/caja" class="btn btn-outline-light btn-sm">💵 Caja Chica</a>
            <a href="/compras" class="btn btn-outline-light btn-sm">🚚 Compras</a>
            <a href="/menu" class="btn btn-outline-light btn-sm">⚙️ Menú</a>
            <a href="/inventario" class="btn btn-outline-light btn-sm">📦 Stock</a>
            <a href="/reportes" class="btn btn-outline-light btn-sm">📊 Reportes</a>
            <a href="/logout" class="btn btn-outline-danger btn-sm">🚪 Salir</a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 pb-4">
    <div class="row g-4">
        <!-- SECCIÓN IZQUIERDA: CATEGORÍAS Y PLATILLOS -->
        <div class="col-md-8">
            <h3 class="mb-3">Menú del Restaurante</h3>

            <!-- Botones de Categorías -->
            <div class="row g-2 mb-4">
                {% for cat in categorias %}
                <div class="col-3">
                    <button class="btn btn-charlie w-100 btn-categoria" onclick="cargarPlatillos({{ cat.id }}, '{{ cat.nombre }}')">
                        {{ cat.nombre }}
                    </button>
                </div>
                {% endfor %}
            </div>

            <!-- Contenedor de Platillos de la Categoría Seleccionada -->
            <div class="card p-3 shadow-sm">
                <h5 id="titulo-categoria" class="card-title text-white-50 mb-3">Selecciona una categoría</h5>
                <div id="grid-platillos" class="grid-menu">
                    <!-- Los botones de platillos se cargan aquí dinámicamente -->
                </div>
            </div>
        </div>

        <!-- SECCIÓN DERECHA: CARRITO DE COMPRA / ORDEN -->
        <div class="col-md-4">
            <div class="card p-3 shadow-sm cart-container">
                <h4 class="card-title text-center border-bottom border-secondary pb-2 mb-3">Orden Actual</h4>
                
                <div class="table-responsive" style="max-height: 320px; overflow-y: auto;">
                    <table class="table table-dark table-sm align-middle">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th class="text-center">Cant.</th>
                                <th class="text-end">Subtotal</th>
                                <th class="text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-carrito">
                            <tr>
                                <td colspan="4" class="text-center text-white-50">No hay productos agregados</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="border-top border-secondary pt-3 mt-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fs-4">TOTAL:</span>
                        <span id="total-monto" class="fs-3 fw-bold text-warning">$0.00</span>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white-50">Método de Pago:</label>
                        <select id="metodo-pago" class="form-select">
                            <option value="Efectivo" selected>💵 Efectivo</option>
                            <option value="Tarjeta">💳 Tarjeta</option>
                            <option value="Transferencia">📲 Transferencia</option>
                        </select>
                    </div>

                    <button class="btn btn-charlie w-100 py-3 fs-5" onclick="procesarPago()">COBRAR E IMPRIMIR</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let carrito = [];

    function cargarPlatillos(categoriaId, nombreCategoria) {
        document.getElementById('titulo-categoria').innerText = 'Categoría: ' + nombreCategoria;
        fetch('/api/platillos/' + categoriaId)
            .then(res => res.json())
            .then(data => {
                let html = '';
                data.forEach(p => {
                    html += `
                        <button class="btn btn-outline-charlie btn-platillo d-flex flex-column align-items-center justify-content-center p-2" 
                                onclick="agregarAlCarrito(${p.id}, '${p.nombre}', ${p.precio})">
                            <span class="text-center fw-bold">${p.nombre}</span>
                            <span class="badge bg-warning text-dark mt-1">$${p.precio.toFixed(2)}</span>
                        </button>
                    `;
                });
                document.getElementById('grid-platillos').innerHTML = html;
            })
            .catch(err => console.error(err));
    }

    function agregarAlCarrito(id, nombre, precio) {
        let item = carrito.find(i => i.id === id);
        if (item) {
            item.cantidad++;
        } else {
            carrito.push({ id, nombre, precio, cantidad: 1 });
        }
        renderizarCarrito();
    }

    function cambiarCantidad(id, cambio) {
        let item = carrito.find(i => i.id === id);
        if (item) {
            item.cantidad += cambio;
            if (item.cantidad <= 0) {
                carrito = carrito.filter(i => i.id !== id);
            }
        }
        renderizarCarrito();
    }

    function eliminarDelCarrito(id) {
        carrito = carrito.filter(i => i.id !== id);
        renderizarCarrito();
    }

    function renderizarCarrito() {
        let tbody = document.getElementById('tabla-carrito');
        let total = 0;

        if (carrito.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-white-50">No hay productos agregados</td></tr>';
            document.getElementById('total-monto').innerText = '$0.00';
            return;
        }

        let html = '';
        carrito.forEach(item => {
            let subtotal = item.precio * item.cantidad;
            total += subtotal;
            html += `
                <tr>
                    <td><small class="fw-bold">${item.nombre}</small></td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-secondary py-0 px-1 text-white" onclick="cambiarCantidad(${item.id}, -1)">-</button>
                        <span class="mx-1">${item.cantidad}</span>
                        <button class="btn btn-sm btn-outline-secondary py-0 px-1 text-white" onclick="cambiarCantidad(${item.id}, 1)">+</button>
                    </td>
                    <td class="text-end fw-bold">$${subtotal.toFixed(2)}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-danger py-0 px-1" onclick="eliminarDelCarrito(${item.id})">×</button>
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = html;
        document.getElementById('total-monto').innerText = '$' + total.toFixed(2);
    }

    function procesarPago() {
        if (carrito.length === 0) {
            alert("Agrega al menos un platillo al carrito.");
            return;
        }

        let metodoPago = document.getElementById('metodo-pago').value;

        fetch('/api/vender', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items: carrito, metodo_pago: metodoPago })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert("¡Venta registrada con éxito!");
                carrito = [];
                renderizarCarrito();
            } else {
                alert("Error al procesar venta: " + data.message);
            }
        })
        .catch(err => {
            alert("Error de conexión al registrar venta");
            console.error(err);
        });
    }
</script>

</body>
</html>
