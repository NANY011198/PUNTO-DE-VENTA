<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario de Insumos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📦 Control de Inventario e Insumos</h2>
            <a href="/" class="btn btn-primary">Volver al Punto de Venta</a>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Insumo / Producto</th>
                            <th>Stock Disponible</th>
                            <th>Unidad de Medida</th>
                            <th>Tipo</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for prod in productos %}
                        <tr>
                            <td><strong>{{ prod.nombre }}</strong></td>
                            <td>{{ prod.stock }}</td>
                            <td>{{ prod.unidad }}</td>
                            <td>
                                {% if prod.es_directo %}
                                <span class="badge bg-info text-dark">Venta Directa</span>
                                {% else %}
                                <span class="badge bg-warning text-dark">Materia Prima / Receta</span>
                                {% endif %}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
