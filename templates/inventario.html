<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Insumos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📦 Inventario de Insumos</h2>
        <div>
            <button class="btn btn-success fw-bold me-2" data-bs-toggle="modal" data-bs-target="#modalInsumo">➕ Crear Nuevo Insumo</button>
            <a href="/" class="btn btn-outline-primary">← Volver al POS</a>
        </div>
    </div>

    <div class="card shadow-sm p-3">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Insumo / Producto</th>
                    <th>Unidad</th>
                    <th>Stock Actual</th>
                </tr>
            </thead>
            <tbody>
                {% for p in productos %}
                <tr>
                    <td>{{ p.id }}</td>
                    <td class="fw-bold">{{ p.nombre }}</td>
                    <td><span class="badge bg-secondary">{{ p.unidad }}</span></td>
                    <td class="fw-bold fs-5 {% if p.stock <= 5 %}text-danger{% else %}text-success{% endif %}">
                        {{ "%.2f"|format(p.stock) }}
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="text-center text-muted py-3">No hay insumos registrados.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL CREAR INSUMO -->
<div class="modal fade" id="modalInsumo" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title fw-bold">➕ Agregar Nuevo Insumo</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre del Insumo:</label>
                    <input type="text" id="ins-nombre" class="form-control" placeholder="Ej. Harina, Queso Cheddar, Jamón">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Unidad de Medida:</label>
                    <select id="ins-unidad" class="form-select">
                        <option value="Gramos">Gramos (g)</option>
                        <option value="Kilos">Kilos (kg)</option>
                        <option value="Litros">Litros (l)</option>
                        <option value="Mililitros">Mililitros (ml)</option>
                        <option value="Unidades" selected>Unidades</option>
                        <option value="Porciones">Porciones</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Stock Inicial:</label>
                    <input type="number" step="0.1" id="ins-stock" class="form-control" value="0">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success fw-bold" onclick="guardarInsumo()">Guardar Insumo</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function guardarInsumo() {
        const nombre = document.getElementById('ins-nombre').value.trim();
        const unidad = document.getElementById('ins-unidad').value;
        const stock_inicial = document.getElementById('ins-stock').value;

        if (!nombre) {
            alert("El nombre del insumo es obligatorio.");
            return;
        }

        fetch('/api/producto/crear', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, unidad, stock_inicial })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert(data.message);
                location.reload();
            } else {
                alert("Error: " + data.message);
            }
        });
    }
</script>
</body>
</html>
