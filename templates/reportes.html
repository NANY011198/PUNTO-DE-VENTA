<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes y Analítica de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📊 Reportes y Analítica de Ventas</h2>
        <a href="/" class="btn btn-outline-primary">← Volver al POS</a>
    </div>

    <!-- FILTRO DE FECHAS -->
    <div class="card shadow-sm p-3 mb-4">
        <div class="row g-3 align-items-center">
            <div class="col-md-4">
                <label class="form-label fw-bold">Fecha Inicio:</label>
                <input type="date" id="fecha-inicio" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold">Fecha Fin:</label>
                <input type="date" id="fecha-fin" class="form-control">
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button class="btn btn-primary w-100 fw-bold me-2" onclick="cargarReporte()">🔍 Filtrar Reporte</button>
                <button class="btn btn-outline-secondary" onclick="limpiarFiltro()">Hoy</button>
            </div>
        </div>
    </div>

    <!-- TARJETAS DE MÉTRICAS -->
    <div class="row mb-4">
        <div class="col-md-4 mb-3">
            <div class="card bg-success text-white shadow-sm p-3">
                <h6 class="text-white-50 text-uppercase fw-bold">Ventas Totales</h6>
                <h2 class="fw-bold mb-0" id="metric-total">$0.00</h2>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card bg-primary text-white shadow-sm p-3">
                <h6 class="text-white-50 text-uppercase fw-bold">Total de Órdenes</h6>
                <h2 class="fw-bold mb-0" id="metric-ordenes">0</h2>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card bg-dark text-white shadow-sm p-3">
                <h6 class="text-white-50 text-uppercase fw-bold">Ticket Promedio</h6>
                <h2 class="fw-bold mb-0" id="metric-ticket">$0.00</h2>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <!-- TOP PLATILLOS -->
        <div class="col-md-7 mb-4">
            <div class="card shadow-sm p-3 h-100">
                <h4 class="card-title mb-3">🏆 Platillos más Vendidos</h4>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Platillo</th>
                                <th class="text-center">Unidades</th>
                                <th class="text-end">Total Recaudado</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-top-platillos">
                            <tr><td colspan="4" class="text-center text-muted py-3">Cargando datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- MÉTODOS DE PAGO GRÁFICO -->
        <div class="col-md-5 mb-4">
            <div class="card shadow-sm p-3 h-100">
                <h4 class="card-title mb-3">💳 Métodos de Pago</h4>
                <div class="d-flex justify-content-center align-items-center style="height: 250px;">
                    <canvas id="chartMetodosPago"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let chartInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('fecha-inicio').value = hoy;
        document.getElementById('fecha-fin').value = hoy;
        cargarReporte();
    });

    function limpiarFiltro() {
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('fecha-inicio').value = hoy;
        document.getElementById('fecha-fin').value = hoy;
        cargarReporte();
    }

    function cargarReporte() {
        const fInicio = document.getElementById('fecha-inicio').value;
        const fFin = document.getElementById('fecha-fin').value;

        fetch(`/api/reportes/datos?fecha_inicio=${fInicio}&fecha_fin=${fFin}`)
        .then(res => res.json())
        .then(data => {
            if (!data.success) {
                alert("Error al cargar reportes: " + data.message);
                return;
            }

            // Actualizar tarjetas
            document.getElementById('metric-total').innerText = `$${data.total_ventas.toFixed(2)}`;
            document.getElementById('metric-ordenes').innerText = data.total_ordenes;
            document.getElementById('metric-ticket').innerText = `$${data.ticket_promedio.toFixed(2)}`;

            // Actualizar Tabla Top Platillos
            const tbody = document.getElementById('tabla-top-platillos');
            tbody.innerHTML = '';
            if (data.top_platillos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">No hay ventas registradas en este período.</td></tr>';
            } else {
                data.top_platillos.forEach((p, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold">${index + 1}</td>
                            <td class="fw-bold text-primary">${p.nombre}</td>
                            <td class="text-center"><span class="badge bg-secondary fs-6">${p.cantidad}</span></td>
                            <td class="text-end fw-bold text-success">$${p.monto.toFixed(2)}</td>
                        </tr>
                    `;
                });
            }

            // Actualizar Gráfico
            renderGraficoMetodos(data.metodos_pago);
        });
    }

    function renderGraficoMetodos(metodos) {
        const ctx = document.getElementById('chartMetodosPago').getContext('2d');
        const labels = Object.keys(metodos);
        const valores = Object.values(metodos);

        if (chartInstance) {
            chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: valores,
                    backgroundColor: ['#198754', '#0d6efd', '#ffc107']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    }
</script>
</body>
</html>
